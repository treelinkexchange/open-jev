[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-jev"
version = "0.1.0"
description = "Typed, calibrated System One decision model (TREELINK fork of kyegomez/open-jev)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["open_jev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
